# Kamal deploy config for AWS EC2.
#
# Before first deploy:
#   1. Launch an EC2 instance (Ubuntu 22.04+ recommended) with ports 22, 80, and 443 open.
#   2. Install Docker on the instance (or let `kamal setup` handle it).
#   3. Add your deploy SSH public key to ~/.ssh/authorized_keys on the instance.
#   4. Set GitHub repository secrets (see .github/workflows/ci.yml deploy job).
#
# Placeholders __DEPLOY_HOST__ and __GITHUB_OWNER__ are replaced by GitHub Actions before deploy.
# For local deploys: export DEPLOY_HOST and GITHUB_OWNER, then run:
#   sed "s|__DEPLOY_HOST__|${DEPLOY_HOST}|g; s|__GITHUB_OWNER__|${GITHUB_OWNER}|g" config/deploy.yml | kamal deploy --config-file /dev/stdin

service: the_book_club

image: __GITHUB_OWNER__/the-book-club

servers:
  web:
    - __DEPLOY_HOST__

# Uncomment after pointing a domain at your EC2 instance (and enable force_ssl in production.rb).
# proxy:
#   ssl: true
#   host: bookclub.example.com

registry:
  server: ghcr.io
  username: __GITHUB_OWNER__
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

volumes:
  - "the_book_club_storage:/rails/storage"

asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: ubuntu
